###############################################################################
# 0. Paths and environment
###############################################################################

BASE=/work/cyu/assembly/worm/hic/scaffolding
ASM=/work/cyu/assembly/worm/hifiasm/purge_q10/repurge_no_rDNA/asm.fa
YAHS=/home/cyu/.conda/envs/hic_tools/bin/yahs

cd "$BASE"

mkdir -p \
    bam/picard_tmp \
    logs \
    yahs \
    qc

echo "Assembly: $ASM"
echo "YaHS:     $YAHS"

###############################################################################
# 1. Add read groups and mark duplicates
###############################################################################

# Input:
# bam/ssolidus_omnic.sorted.bam
#
# This BAM must be coordinate sorted.

picard AddOrReplaceReadGroups \
    I="$BASE/bam/ssolidus_omnic.sorted.bam" \
    O="$BASE/bam/ssolidus_omnic.rg.sorted.bam" \
    RGID=ssolidus_omnic \
    RGLB=ssolidus_omnic_lib1 \
    RGPL=ILLUMINA \
    RGPU=Solidus7-4_S126_L006 \
    RGSM=ssolidus \
    SORT_ORDER=coordinate \
    CREATE_INDEX=false \
    VALIDATION_STRINGENCY=LENIENT \
    TMP_DIR="$BASE/bam/picard_tmp" \
    2> "$BASE/logs/03_add_rg.log"

picard MarkDuplicates \
    I="$BASE/bam/ssolidus_omnic.rg.sorted.bam" \
    O="$BASE/bam/ssolidus_omnic.picard_markdup.bam" \
    M="$BASE/bam/ssolidus_omnic.picard_markdup.metrics.txt" \
    TMP_DIR="$BASE/bam/picard_tmp" \
    REMOVE_DUPLICATES=false \
    CREATE_INDEX=true \
    VALIDATION_STRINGENCY=LENIENT \
    ASSUME_SORT_ORDER=coordinate \
    2> "$BASE/logs/03_picard_markdup.log"

echo "Picard duplicate marking finished."

###############################################################################
# 2. Basic BAM QC
###############################################################################

samtools quickcheck -v \
    "$BASE/bam/ssolidus_omnic.picard_markdup.bam"

samtools flagstat \
    -@ 16 \
    "$BASE/bam/ssolidus_omnic.picard_markdup.bam" \
    > "$BASE/qc/ssolidus_omnic.picard_markdup.flagstat.txt"

samtools stats \
    -@ 16 \
    "$BASE/bam/ssolidus_omnic.picard_markdup.bam" \
    > "$BASE/qc/ssolidus_omnic.picard_markdup.samtools_stats.txt"

echo "===== Picard duplication metrics ====="

grep -A2 '^LIBRARY' \
    "$BASE/bam/ssolidus_omnic.picard_markdup.metrics.txt" || true

###############################################################################
# 3. Count reads/pairs retained at different MAPQ thresholds
###############################################################################

BAM_COORD="$BASE/bam/ssolidus_omnic.picard_markdup.bam"
MAPQ_OUT="$BASE/qc/mapq_read_counts.tsv"

printf "filter\treads\tapprox_pairs\n" > "$MAPQ_OUT"

# All alignments
N=$(samtools view -c "$BAM_COORD")
printf "all\t%s\t%s\n" "$N" "$((N / 2))" >> "$MAPQ_OUT"

# Mapped reads
N=$(samtools view -c -F 4 "$BAM_COORD")
printf "mapped\t%s\t%s\n" "$N" "$((N / 2))" >> "$MAPQ_OUT"

# Primary mapped reads, including duplicates
# -F 0x904 removes:
#   0x004 unmapped
#   0x100 secondary
#   0x800 supplementary

for Q in 1 5 10 20 30
do
    N=$(samtools view -c -q "$Q" -F 0x904 "$BAM_COORD")
    printf "primary_MAPQ%s_with_duplicates\t%s\t%s\n" \
        "$Q" "$N" "$((N / 2))" >> "$MAPQ_OUT"
done

# Primary mapped reads, excluding duplicates
# -F 0xD04 removes:
#   0x004 unmapped
#   0x100 secondary
#   0x400 duplicate
#   0x800 supplementary

for Q in 1 5 10 20 30
do
    N=$(samtools view -c -q "$Q" -F 0xD04 "$BAM_COORD")
    printf "primary_MAPQ%s_no_duplicates\t%s\t%s\n" \
        "$Q" "$N" "$((N / 2))" >> "$MAPQ_OUT"
done

column -t "$MAPQ_OUT"

###############################################################################
# 4. More detailed flag counts
###############################################################################

{
    echo -e "category\tread_count"

    echo -e "total\t$(samtools view -c "$BAM_COORD")"

    echo -e "mapped\t$(samtools view -c -F 4 "$BAM_COORD")"

    echo -e "duplicates\t$(samtools view -c -f 0x400 "$BAM_COORD")"

    echo -e "secondary\t$(samtools view -c -f 0x100 "$BAM_COORD")"

    echo -e "supplementary\t$(samtools view -c -f 0x800 "$BAM_COORD")"

    echo -e "primary_mapped_nonduplicate\t$(samtools view -c -F 0xD04 "$BAM_COORD")"

    echo -e "primary_mapped_nonduplicate_q10\t$(samtools view -c -q 10 -F 0xD04 "$BAM_COORD")"

    echo -e "primary_mapped_nonduplicate_q20\t$(samtools view -c -q 20 -F 0xD04 "$BAM_COORD")"

} > "$BASE/qc/bam_flag_summary.tsv"

column -t "$BASE/qc/bam_flag_summary.tsv"

###############################################################################
# 5. Examine MAPQ distribution
###############################################################################

samtools view \
    -F 0x904 \
    "$BAM_COORD" \
| awk '
{
    mapq[$5]++
}
END{
    print "MAPQ\tread_count"
    for(q in mapq){
        print q "\t" mapq[q]
    }
}' \
| sort -k1,1n \
> "$BASE/qc/mapq_distribution.tsv"

head "$BASE/qc/mapq_distribution.tsv"
tail "$BASE/qc/mapq_distribution.tsv"

###############################################################################
# 6. Name-sort the duplicate-marked BAM for YaHS
###############################################################################

samtools sort \
    -n \
    -@ 24 \
    -m 4G \
    -T "$BASE/bam/picard_tmp/ssolidus_omnic.namesort" \
    -o "$BASE/bam/ssolidus_omnic.picard_markdup.name_sorted.bam" \
    "$BASE/bam/ssolidus_omnic.picard_markdup.bam"

samtools quickcheck -v \
    "$BASE/bam/ssolidus_omnic.picard_markdup.name_sorted.bam"

BAM="$BASE/bam/ssolidus_omnic.picard_markdup.name_sorted.bam"

echo "YaHS BAM: $BAM"

###############################################################################
# 7. Optional: verify name sorting
###############################################################################

samtools view "$BAM" \
| head -20 \
| cut -f1-5

###############################################################################
# 8. Function for running YaHS
###############################################################################

run_yahs () {

    RUN_NAME=$1
    MAPQ=$2
    EXTRA_OPTIONS=$3

    OUTDIR="$BASE/yahs/$RUN_NAME"
    PREFIX="ssolidus_${RUN_NAME}"

    mkdir -p "$OUTDIR"
    cd "$OUTDIR"

    echo
    echo "============================================================"
    echo "Running: $RUN_NAME"
    echo "MAPQ:    $MAPQ"
    echo "Options: $EXTRA_OPTIONS"
    echo "============================================================"

    # shellcheck disable=SC2086
    "$YAHS" "$ASM" "$BAM" \
        -q "$MAPQ" \
        $EXTRA_OPTIONS \
        -o "$PREFIX" \
        > "$BASE/logs/${RUN_NAME}.stdout.log" \
        2> "$BASE/logs/${RUN_NAME}.stderr.log"

    echo "Finished: $RUN_NAME"
}

###############################################################################
# 9. YaHS parameter tests actually performed
###############################################################################

###############################################################################
# 9.1 q20 default
#
# Contig error correction: enabled
# Scaffold error correction: enabled
###############################################################################

run_yahs \
    q20_default \
    20 \
    ""

###############################################################################
# 9.2 q20, no contig error correction
###############################################################################

run_yahs \
    q20_no_contig_ec \
    20 \
    "--no-contig-ec"

###############################################################################
# 9.3 q10, no contig error correction
#
# Main conservative candidate.
###############################################################################

run_yahs \
    q10_no_contig_ec \
    10 \
    "--no-contig-ec"

###############################################################################
# 9.4 q1, no contig error correction
###############################################################################

run_yahs \
    q1_no_contig_ec \
    1 \
    "--no-contig-ec"

###############################################################################
# 9.5 q1, three rounds, no contig EC, no scaffold EC, telomere motif
#
# Aggressive sensitivity run.
###############################################################################

run_yahs \
    q1_R3_no_scaffold_ec \
    1 \
    "--no-contig-ec --no-scaffold-ec -R 3 --telo-motif AACCCT"

###############################################################################
# 9.6 q10, telomere motif, no contig EC
###############################################################################

run_yahs \
    q10_telo_no_contig_ec \
    10 \
    "--no-contig-ec --telo-motif AACCCT"

###############################################################################
# 9.7 q10, resolution starts at 100 kb
###############################################################################

run_yahs \
    q10_r100k_telo_no_contig_ec \
    10 \
    "--no-contig-ec --telo-motif AACCCT \
-r 100000,200000,500000,1000000,2000000,5000000,10000000,20000000,50000000,100000000,200000000,500000000"

###############################################################################
# 9.8 q10, resolution starts at 500 kb
###############################################################################

run_yahs \
    q10_r500k_telo_no_contig_ec \
    10 \
    "--no-contig-ec --telo-motif AACCCT \
-r 500000,1000000,2000000,5000000,10000000,20000000,50000000,100000000,200000000,500000000"

###############################################################################
# 10. Additional useful resolution tests
###############################################################################

###############################################################################
# 10.1 q10, resolution starts at 200 kb
###############################################################################

run_yahs \
    q10_r200k_telo_no_contig_ec \
    10 \
    "--no-contig-ec --telo-motif AACCCT \
-r 200000,500000,1000000,2000000,5000000,10000000,20000000,50000000,100000000,200000000,500000000"

###############################################################################
# 10.2 q10, resolution starts at 300 kb
###############################################################################

run_yahs \
    q10_r300k_telo_no_contig_ec \
    10 \
    "--no-contig-ec --telo-motif AACCCT \
-r 300000,500000,1000000,2000000,5000000,10000000,20000000,50000000,100000000,200000000,500000000"

###############################################################################
# 10.3 Optional intermediate MAPQ run
###############################################################################

run_yahs \
    q5_no_contig_ec \
    5 \
    "--no-contig-ec"

###############################################################################
# 11. Return to base directory
###############################################################################

cd "$BASE"

###############################################################################
# 12. Summarize all YaHS assemblies
###############################################################################

SUMMARY="$BASE/qc/yahs_parameter_summary.tsv"

printf \
"run\ttotal_scaffolds\ttotal_length\tmin_length\tmean_length\tlargest_scaffold\tge_50Mb\tge_20Mb\tge_10Mb\tge_1Mb\ttop14_length\ttop14_percent\n" \
> "$SUMMARY"

for DIR in "$BASE"/yahs/*
do
    [[ -d "$DIR" ]] || continue

    RUN=$(basename "$DIR")

    FA=$(find "$DIR" \
        -maxdepth 1 \
        -type f \
        -name "*_scaffolds_final.fa" \
        | head -1)

    if [[ -z "${FA:-}" || ! -s "$FA" ]]
    then
        echo "No final FASTA found for: $RUN" >&2
        continue
    fi

    seqkit fx2tab -n -l "$FA" \
    | sort -k2,2nr \
    | awk -v run="$RUN" '
    {
        n++
        total += $2

        if(n == 1){
            max = $2
        }

        if(min == 0 || $2 < min){
            min = $2
        }

        if($2 >= 50000000) n50++
        if($2 >= 20000000) n20++
        if($2 >= 10000000) n10++
        if($2 >= 1000000)  n1++

        if(n <= 14){
            top14 += $2
        }
    }
    END{
        mean = total/n
        pct = top14/total*100

        printf "%s\t%d\t%d\t%d\t%.1f\t%d\t%d\t%d\t%d\t%d\t%d\t%.2f\n",
            run,
            n,
            total,
            min,
            mean,
            max,
            n50+0,
            n20+0,
            n10+0,
            n1+0,
            top14,
            pct
    }' \
    >> "$SUMMARY"
done

column -t "$SUMMARY"

###############################################################################
# 13. Print top 20 scaffold lengths for every run
###############################################################################

TOP_OUT="$BASE/qc/yahs_top20_scaffold_lengths.txt"

: > "$TOP_OUT"

for DIR in "$BASE"/yahs/*
do
    [[ -d "$DIR" ]] || continue

    RUN=$(basename "$DIR")

    FA=$(find "$DIR" \
        -maxdepth 1 \
        -type f \
        -name "*_scaffolds_final.fa" \
        | head -1)

    [[ -s "${FA:-}" ]] || continue

    {
        echo "============================================================"
        echo "$RUN"
        echo "$FA"
        echo "============================================================"

        seqkit fx2tab -n -l "$FA" \
        | sort -k2,2nr \
        | head -20

        echo
    } >> "$TOP_OUT"
done

cat "$TOP_OUT"

###############################################################################
# 14. Main q10 assembly statistics
###############################################################################

MAIN_FA="$BASE/yahs/q10_no_contig_ec/ssolidus_q10_no_contig_ec_scaffolds_final.fa"

echo
echo "===== Main q10 no-contig-EC assembly ====="

seqkit stats "$MAIN_FA"

TOTAL=$(
    seqkit fx2tab -n -l "$MAIN_FA" \
    | awk '{s+=$2} END{print s}'
)

TOP14=$(
    seqkit fx2tab -n -l "$MAIN_FA" \
    | sort -k2,2nr \
    | head -14 \
    | awk '{s+=$2} END{print s}'
)

awk \
    -v top="$TOP14" \
    -v total="$TOTAL" \
    'BEGIN{
        printf "Top 14 length: %d bp\n", top
        printf "Total length: %d bp\n", total
        printf "Top 14 proportion: %.2f%%\n", top/total*100
        printf "Remaining length: %d bp\n", total-top
        printf "Remaining proportion: %.2f%%\n", (total-top)/total*100
    }'

###############################################################################
# 15. Finished
###############################################################################

echo
echo "All completed."
echo "Main summary:"
echo "$SUMMARY"




#tidk telomere motif discovery
#!/usr/bin/env bash

set -euo pipefail

###############################################################################
# Telomere analysis using TIDK
###############################################################################

BASE=/work/cyu/assembly/worm/hic/scaffolding

# Main conservative YaHS assembly
FA=$BASE/yahs/q10_no_contig_ec/ssolidus_q10_no_contig_ec_scaffolds_final.fa

# Candidate telomeric repeat identified by TIDK
MOTIF=AACCCT

TELO=$BASE/telomere/q10_no_contig_ec
mkdir -p "$TELO"

cd "$TELO"

###############################################################################
# 1. Check TIDK installation and version
###############################################################################

which tidk
tidk --version

###############################################################################
# 2. De novo exploration of candidate telomeric repeats
#
# Search repeat units between 5 and 12 bp.
# The output is used to identify highly abundant short tandem repeats.
###############################################################################

mkdir -p "$TELO/explore"

tidk explore \
    --minimum 5 \
    --maximum 12 \
    --output q10_no_contig_ec_telomere_explore \
    "$FA" \
    > "$TELO/explore/tidk_explore.stdout.log" \
    2> "$TELO/explore/tidk_explore.stderr.log"

###############################################################################
# 3. Inspect the top candidate repeat units
###############################################################################

find "$TELO/explore" -type f -maxdepth 2 -ls

grep -R -v '^$' "$TELO/explore" \
    | head -100 \
    > "$TELO/explore/top_candidate_repeats.txt"

###############################################################################
# 4. Search the selected AACCCT motif across the genome
#
# Window size = 100 kb.
###############################################################################

mkdir -p "$TELO/search_100kb"

tidk search \
    --string "$MOTIF" \
    --window 100000 \
    --output q10_AACCCT_100kb \
    "$FA" \
    > "$TELO/search_100kb/tidk_search.stdout.log" \
    2> "$TELO/search_100kb/tidk_search.stderr.log"

###############################################################################
# 5. Find TIDK output
###############################################################################

find "$TELO/search_100kb" "$TELO" \
    -type f \
    \( -name "*.tsv" -o -name "*.txt" -o -name "*.csv" \) \
    -ls

###############################################################################
# 6. Generate assembly scaffold lengths
###############################################################################

seqkit fx2tab -n -l "$FA" \
    | sort -k2,2nr \
    > "$TELO/q10_scaffold_lengths.tsv"

head -20 "$TELO/q10_scaffold_lengths.tsv"

###############################################################################
# 7. Extract the largest 15 scaffolds
###############################################################################

head -15 "$TELO/q10_scaffold_lengths.tsv" \
    > "$TELO/top15_scaffold_lengths.tsv"

cut -f1 "$TELO/top15_scaffold_lengths.tsv" \
    > "$TELO/top15_scaffold_ids.txt"

seqkit grep \
    -f "$TELO/top15_scaffold_ids.txt" \
    "$FA" \
    > "$TELO/top15_scaffolds.fa"

###############################################################################
# 8. Extract terminal 20-kb sequences from the top 15 scaffolds
#
# Left end:  first 20 kb
# Right end: last 20 kb
###############################################################################

END_SIZE=20000

mkdir -p "$TELO/terminal_20kb"

while read -r SCAF LEN
do
    LEFT_END=$END_SIZE

    if (( LEN < END_SIZE ))
    then
        LEFT_END=$LEN
    fi

    RIGHT_START=$((LEN - END_SIZE + 1))

    if (( RIGHT_START < 1 ))
    then
        RIGHT_START=1
    fi

    seqkit subseq \
        -r "1-${LEFT_END}" \
        -p "$SCAF" \
        "$FA" \
        > "$TELO/terminal_20kb/${SCAF}.left20kb.fa"

    seqkit subseq \
        -r "${RIGHT_START}:${LEN}" \
        -p "$SCAF" \
        "$FA" \
        > "$TELO/terminal_20kb/${SCAF}.right20kb.fa"

done < "$TELO/top15_scaffold_lengths.tsv"

###############################################################################
# 9. Count exact motif occurrences at each terminal end
#
# Counts both AACCCT and its reverse-complement representation AGGGTT.
# The canonical TTAGGG/CCCTAA repeat can appear in rotated orientation,
# so both strands are counted.
###############################################################################

RC_MOTIF=AGGGTT

OUT=$TELO/top15_terminal20kb_telomere_counts.tsv

printf \
"scaffold\tlength\tleft_AACCCT\tleft_AGGGTT\tleft_total\tright_AACCCT\tright_AGGGTT\tright_total\n" \
> "$OUT"

while read -r SCAF LEN
do
    LEFT_FA="$TELO/terminal_20kb/${SCAF}.left20kb.fa"
    RIGHT_FA="$TELO/terminal_20kb/${SCAF}.right20kb.fa"

    LEFT_SEQ=$(
        seqkit seq -s -w 0 "$LEFT_FA" \
        | tr '[:lower:]' '[:upper:]'
    )

    RIGHT_SEQ=$(
        seqkit seq -s -w 0 "$RIGHT_FA" \
        | tr '[:lower:]' '[:upper:]'
    )

    LEFT_FORWARD=$(
        printf "%s" "$LEFT_SEQ" \
        | grep -o "$MOTIF" \
        | wc -l
    )

    LEFT_REVERSE=$(
        printf "%s" "$LEFT_SEQ" \
        | grep -o "$RC_MOTIF" \
        | wc -l
    )

    RIGHT_FORWARD=$(
        printf "%s" "$RIGHT_SEQ" \
        | grep -o "$MOTIF" \
        | wc -l
    )

    RIGHT_REVERSE=$(
        printf "%s" "$RIGHT_SEQ" \
        | grep -o "$RC_MOTIF" \
        | wc -l
    )

    LEFT_TOTAL=$((LEFT_FORWARD + LEFT_REVERSE))
    RIGHT_TOTAL=$((RIGHT_FORWARD + RIGHT_REVERSE))

    printf \
    "%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n" \
    "$SCAF" \
    "$LEN" \
    "$LEFT_FORWARD" \
    "$LEFT_REVERSE" \
    "$LEFT_TOTAL" \
    "$RIGHT_FORWARD" \
    "$RIGHT_REVERSE" \
    "$RIGHT_TOTAL" \
    >> "$OUT"

done < "$TELO/top15_scaffold_lengths.tsv"

column -t "$OUT"

###############################################################################
# 10. Classify strong telomeric ends
#
# Operational threshold:
# >=500 exact repeat occurrences within the terminal 20 kb.
###############################################################################

THRESHOLD=500

awk \
    -F '\t' \
    -v OFS='\t' \
    -v cutoff="$THRESHOLD" \
    '
    NR == 1 {
        print $0, "left_status", "right_status", "number_strong_ends"
        next
    }
    {
        left_status  = ($5 >= cutoff ? "strong" : "weak_or_absent")
        right_status = ($8 >= cutoff ? "strong" : "weak_or_absent")

        n = 0
        if($5 >= cutoff) n++
        if($8 >= cutoff) n++

        print $0, left_status, right_status, n
    }
    ' \
    "$OUT" \
    > "$TELO/top15_terminal20kb_telomere_classification.tsv"

column -t "$TELO/top15_terminal20kb_telomere_classification.tsv"

###############################################################################
# 11. Summarize the number of telomere-positive ends
###############################################################################

awk \
    -F '\t' \
    -v cutoff="$THRESHOLD" \
    '
    NR > 1 {
        scaffolds++

        if($5 >= cutoff){
            left_positive++
            total_positive++
        }

        if($8 >= cutoff){
            right_positive++
            total_positive++
        }

        if($5 >= cutoff && $8 >= cutoff){
            both_positive++
        }

        if($5 >= cutoff || $8 >= cutoff){
            scaffold_positive++
        }
    }
    END{
        print "Top scaffolds evaluated:", scaffolds
        print "Strong left ends:", left_positive+0
        print "Strong right ends:", right_positive+0
        print "Total strong terminal ends:", total_positive+0
        print "Scaffolds with >=1 strong end:", scaffold_positive+0
        print "Scaffolds with strong signals at both ends:", both_positive+0
    }
    ' \
    "$OUT" \
    > "$TELO/top15_telomere_summary.txt"

cat "$TELO/top15_telomere_summary.txt"

###############################################################################
# 12. Sort telomere ends by repeat count
###############################################################################

{
    echo -e "scaffold\tend\trepeat_count"

    awk -F '\t' '
    NR > 1 {
        print $1 "\tLeft\t"  $5
        print $1 "\tRight\t" $8
    }' "$OUT"

} \
| {
    read -r HEADER
    echo "$HEADER"
    sort -k3,3nr
} \
> "$TELO/top15_all_ends_ranked.tsv"

column -t "$TELO/top15_all_ends_ranked.tsv"

###############################################################################
# 13. Strong terminal ends only
###############################################################################

awk \
    -F '\t' \
    -v cutoff="$THRESHOLD" \
    '
    BEGIN{
        OFS="\t"
        print "scaffold", "end", "repeat_count"
    }

    NR > 1 {
        if($5 >= cutoff){
            print $1, "Left", $5
        }

        if($8 >= cutoff){
            print $1, "Right", $8
        }
    }
    ' \
    "$OUT" \
    | {
        read -r HEADER
        echo "$HEADER"
        sort -k3,3nr
    } \
    > "$TELO/top15_strong_telomere_ends.tsv"

column -t "$TELO/top15_strong_telomere_ends.tsv"

###############################################################################
# 14. Finished
###############################################################################

echo
echo "Telomere analysis completed."
echo
echo "Main result files:"
echo "$TELO/top15_terminal20kb_telomere_counts.tsv"
echo "$TELO/top15_terminal20kb_telomere_classification.tsv"
echo "$TELO/top15_strong_telomere_ends.tsv"
echo "$TELO/top15_telomere_summary.txt"


#conda activate /home/cyu/.conda/envs/genome_assembly

mkdir -p /work/cyu/assembly/worm/final_validation

busco \
-i /work/shared/cyu/worm/worm.q10_r500k_no_contig_ec.scaffolds.fa \
-l metazoa_odb10 \
-m genome \
-c 32 \
-o busco.q10_r500k \
--out_path /work/cyu/assembly/worm/final_validation


quast \
-t 32 \
-o /work/cyu/assembly/worm/final_validation/quast.q10_r500k \
/work/shared/cyu/worm/worm.q10_r500k_no_contig_ec.scaffolds.fa


